name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"] # releases are handled by release.yml
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build check
        run: go build ./cmd/balafetch/

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
